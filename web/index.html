<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tel Aviv in voxels</title>
  <script>
    // served under a folder (natanel.ca/voxels/): without the trailing slash the relative paths would miss
    if (!/\/$|\.html$/.test(location.pathname)) location.replace(location.pathname + '/' + location.search + location.hash);
  </script>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 1l6 3.5-6 3.5-6-3.5z' fill='%23f4efe4'/%3E%3Cpath d='M2 4.5l6 3.5v7l-6-3.5z' fill='%231f6fb2'/%3E%3Cpath d='M14 4.5l-6 3.5v7l6-3.5z' fill='%2314507f'/%3E%3C/svg%3E" />
  <meta name="description" content="Tel Aviv-Yafo and Rehovot as 1 m voxel dioramas, from OpenStreetMap" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="app"></div>
  <header class="card title">
    <div class="names"><h1 id="city-en">…</h1><span id="city-he" dir="rtl"></span></div>
    <nav id="city-switch"></nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search an address or place · חיפוש כתובת" autocomplete="off" spellcheck="false" aria-label="Search" />
      <ul id="results" hidden></ul>
    </div>
  </header>
  <footer class="card bar">
    <button id="play" title="Play the day">▶</button>
    <div class="time"><button id="now" class="now" title="The sun as it is in Israel right now, following the clock">Now</button><span id="clock">17:36</span><input id="hour" type="range" min="0" max="23.99" step="0.01" aria-label="Time of day" /></div>
    <select id="month" aria-label="Month"></select>
    <select id="weather" aria-label="Weather"></select>
    <select id="views" aria-label="Go to"></select>
    <label class="tog"><input id="show-labels" type="checkbox" checked /> Labels</label>
    <label class="tog" title="Tilt-shift blur, like a photo of a model"><input id="tilt" type="checkbox" /> Miniature</label>
  </footer>
  <div id="loading" class="loading">loading tiles…</div>
  <div class="credits">
    <div class="by">by <a href="https://natanel.ca">Natanel Roizenman</a> &amp; Opus 5.5 · <a href="https://github.com/nroize">GitHub</a> · inspired by <a href="https://github.com/stared/warsaw-vibe-voxel">Warsaw in voxels</a> by Piotr Migdał</div>
    <div>© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors (<span id="osm-date"></span>) · <a href="https://dataspace.copernicus.eu/explore-data/data-collections/copernicus-contributing-missions/collections-description/COP-DEM">Copernicus GLO-30 DEM</a> <span id="stats"></span></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
